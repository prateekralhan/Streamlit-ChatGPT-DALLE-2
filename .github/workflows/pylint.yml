name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring,line-too-long,too-many-locals,too-many-return-statements,broad-exception-caught,redefined-outer-name,import-outside-toplevel,trailing-newlines --fail-under=8.0 $(git ls-files '*.py')
